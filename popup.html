<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leads Tracker</title>
  <link rel="stylesheet" href="popup.css"> <!-- Link to the CSS file -->
</head>
<body>
  <h2>Leads Tracker</h2>
  <form id="leadForm">
    <input type="url" id="leadUrl" placeholder="Lead URL" required>
    <input type="text" id="leadName" placeholder="Lead Name (Optional)">
    <button type="submit">Add Lead</button>
  </form>
  <div id="leadList"></div> <!-- List of leads will be displayed here -->
  <script src="popup.js"></script>
</body>
</html>
